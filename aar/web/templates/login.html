<!doctype html>
<html lang="nl" class="h-full bg-ink-950">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aanmelden — AAR Tool</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'] },
          colors: {
            ink: { 50:'#f7f7f8',100:'#eeeef0',200:'#d9dade',300:'#b7b9c0',400:'#8d909b',
                   500:'#6b6e79',600:'#54565f',700:'#43454d',800:'#2c2d33',900:'#1a1b1f',950:'#101114' },
            accent: { 50:'#f2f4f7',100:'#e3e7ee',200:'#c8d0dd',300:'#a2aec3',400:'#7889a5',
                      500:'#5b6d8c',600:'#485774',700:'#3c485f',800:'#333c4d',900:'#2c3341' }
          }
        }
      }
    }
  </script>
</head>
<body class="h-full font-sans text-[14px] antialiased flex items-center justify-center">
  <div class="w-full max-w-[360px] px-6">
    <div class="flex flex-col items-center mb-8">
      <span class="flex h-10 w-10 items-center justify-center rounded-md bg-accent-600 text-white mb-3">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.75" stroke="currentColor" class="w-5 h-5"><path stroke-linecap="round" stroke-linejoin="round" d="M3 3v18M3 4.5h13.5l-1.5 3 1.5 3H3" /></svg>
      </span>
      <div class="text-white font-semibold tracking-tight">AAR Tool</div>
      <div class="text-ink-500 text-[11px] font-medium tracking-wide mt-0.5">BRANDWEER &middot; INTERNE EVALUATIE</div>
    </div>

    <div class="rounded-lg bg-ink-900 border border-white/[0.06] p-6">
      {% if error %}
      <div class="mb-4 rounded-md bg-rose-950/40 border border-rose-900/50 px-3 py-2 text-[12.5px] text-rose-300">
        {{ error }}
      </div>
      {% endif %}
      <form method="post" action="/login">
        <input type="hidden" name="next" value="{{ next }}">
        <label class="block text-[12px] font-medium text-ink-400 mb-1.5">Wachtwoord</label>
        <input type="password" name="password" autofocus required
               class="w-full rounded-md border border-white/10 bg-white/[0.04] px-3 py-2 text-[13px] text-white
                      placeholder:text-ink-600 focus:border-accent-500 focus:outline-none focus:ring-1 focus:ring-accent-500">
        <button type="submit"
                class="mt-4 w-full rounded-md bg-white px-3.5 py-2 text-[13px] font-semibold text-ink-950 hover:bg-ink-100 transition">
          Aanmelden
        </button>
      </form>
    </div>

    <p class="mt-5 text-center text-[11.5px] text-ink-600">Interne tool &middot; enkel voor de AAR-facilitator</p>
  </div>
</body>
</html>
